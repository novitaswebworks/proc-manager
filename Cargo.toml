[package]
name = "proc-manager"
version = "1.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.1"
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.34"
netstat2 = "0.11.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
ssh2 = "0.9.6"
sysinfo = "0.39.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
